name: Deploy

on:
  push:
    branches: [main]
    # only what reaches production (workflow.md, Deploy paths): specs and docs don't redeploy.
    # A path the build starts using (a new COPY) goes here and into project.md's owner boundary in the same commit
    paths:
{{DEPLOY_PATHS}}
  workflow_dispatch:

# one deploy at a time: two pushes in a row must not race on the image tags and compose up
concurrency:
  group: deploy

jobs:
  deploy:
    # a manual dispatch from another branch would ship unverified code as :latest
    if: github.ref == 'refs/heads/main'
    # the EC2 host is arm64 and never compiles: build natively here, the host only pulls
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # project.md's verification, so nothing unchecked reaches production.
      # A project whose verification can't run on a Linux runner deletes these steps
{{VERIFY_STEPS}}

      # GHCR wants a lowercase name; the repo owner's login may not be
      - id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # one such step per image
      - name: Build and push {{IMAGE}}
        uses: docker/build-push-action@v7
        with:
          context: {{CONTEXT}}
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.registry }}/{{IMAGE}}:${{ steps.meta.outputs.tag }},${{ steps.meta.outputs.registry }}/{{IMAGE}}:latest
          cache-from: type=gha,scope={{IMAGE}}
          cache-to: type=gha,scope={{IMAGE}},mode=max

      # repo secrets, not org ones: on GitHub Free, org secrets come back empty in a private repo
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # the host has no checkout: ship compose.yaml so service changes land too (.env stays the host's)
      - run: scp compose.yaml "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.DEPLOY_PATH }}/compose.yaml"

      - name: Pull and restart on the host
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            docker compose pull
            docker compose up -d
            # liveness only
            curl -fsS -o /dev/null --retry 30 --retry-connrefused --retry-delay 2 http://localhost:{{PORT}}/
            docker image prune -f'
